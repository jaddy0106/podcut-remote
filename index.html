<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PODcut 리모컨">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>PODcut 리모컨</title>
<!-- Pretendard: the 익평삼 subtitles' typeface, for the subtitle preview (only the letters used load). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<!-- The phone remote for PODcut (익평삼): docs/REMOTE.md in the app's repository.
     Public page: it holds no secret. The pairing token lives in this phone's storage only. -->
<style>
:root{
  --window:#F3F4F6;--panel:#FFFFFF;--raised:#EEF0F3;--line:#DDE1E6;--line-strong:#C5CBD3;
  --text:#15171A;--text2:#555B64;--text3:#858B94;--accent:#2563EB;--accent-soft:#E4ECFD;--accent-text:#1D4ED8;
  --ok:#15803D;--ok-soft:#DCFCE7;--bad:#B91C1C;--bad-soft:#FEE2E2;--warn:#A16207;
}
@media (prefers-color-scheme: dark){:root{
  --window:#0E0F11;--panel:#16181B;--raised:#1F2226;--line:#2C3036;--line-strong:#3A3F46;
  --text:#ECEEF1;--text2:#A4A9B1;--text3:#858B94;--accent:#2F6FE4;--accent-soft:#1B2B4A;--accent-text:#8AB8FF;
  --ok:#4ADE80;--ok-soft:#14321F;--bad:#F87171;--bad-soft:#3A1717;--warn:#FACC15;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--window);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;gap:10px;padding:16px 0 8px}
header img{width:32px;height:32px;border-radius:8px}
header h1{font-size:19px;margin:0;flex:1}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--raised);color:var(--text);cursor:pointer;min-height:40px}
button.primary{background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--accent-text);padding:8px 10px}
button:disabled{opacity:.5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.card h2{font-size:13px;font-weight:600;color:var(--text3);margin:0;padding:12px 14px 6px;letter-spacing:.02em}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);min-height:52px}
.card h2+.row{border-top:0}
.row .main{flex:1;min-width:0}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12.5px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:14px;color:var(--text3);font-size:14px}
.pill{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--raised);color:var(--text2);white-space:nowrap}
.pill.run{background:var(--accent-soft);color:var(--accent-text)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:4px;border-radius:2px;background:var(--raised);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.bar.wait i{width:30%;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.status{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text2);padding:0 2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text3)}
.dot.on{background:var(--ok)}
select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px;max-width:100%}
input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.code{font:600 26px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;text-align:center}
.pair{padding:20px 16px;text-align:center}
.pair p{color:var(--text2);margin:6px 0 16px}
.hint{font-size:13px;color:var(--text3);margin:10px 2px}
.error{color:var(--bad);font-size:14px;margin:10px 2px;min-height:1em}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.open{display:flex}
.sheet>div{background:var(--panel);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
button.icon{background:transparent;color:var(--accent-text);font-size:26px;line-height:1;padding:4px 10px;min-height:40px}
.x{background:transparent;color:var(--text3);padding:6px 8px;min-height:32px;font-size:18px;line-height:1}
.tabs{margin:14px 0 0}
.tabs button .n{color:var(--text3);font-weight:400;margin-left:4px}
.pickList{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:4px}
.pickList .row{cursor:pointer}
.pickList .row:first-child{border-top:0}
.pickList .row[aria-checked=true]{background:var(--accent-soft)}
.pickList .row[aria-checked=true] .name{color:var(--accent-text)}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-strong);flex:none}
.row[aria-checked=true] .check{border:6px solid var(--accent)}
.sheet h3{margin:0 0 4px;font-size:17px}
.seg{display:flex;background:var(--raised);border-radius:10px;padding:3px;gap:3px;margin:8px 0 4px}
.seg button{flex:1;background:transparent;min-height:36px;padding:6px}
.seg button[aria-pressed=true]{background:var(--panel);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
label{display:block;font-size:13px;color:var(--text3);margin:12px 0 4px}
.actions{display:flex;gap:8px;margin-top:16px}
.actions button{flex:1}
.row.tap{cursor:pointer}
.row.tap:active{background:var(--raised)}
.chev{color:var(--text3);font-size:20px;line-height:1}
#cueView{position:fixed;inset:0;background:var(--window);z-index:4;display:flex;flex-direction:column}
#cueView[hidden]{display:none!important}
.cueHead{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 8px 6px;max-width:760px;width:100%;margin:0 auto}
.cueHead .name{flex:1;font-size:16px}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.frame canvas{width:100%;height:100%;display:block}
.cueTop{max-width:760px;width:100%;margin:0 auto;padding:0 12px}
.cueNote{font-size:12.5px;color:var(--text3);margin:6px 2px 4px;min-height:1.2em}
.cueNote.bad{color:var(--bad)}
.cueList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;max-width:760px;width:100%;margin:0 auto;padding:0 12px calc(16px + env(safe-area-inset-bottom))}
.chapter{font-size:12.5px;font-weight:600;color:var(--text3);padding:14px 4px 4px;letter-spacing:.02em}
.cue{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin:6px 0;cursor:pointer}
.cue.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cue .who{flex:none;width:52px;font-size:12px;color:var(--text3);line-height:1.3}
.cue .who b{display:block;color:var(--text2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cue .text{flex:1;min-width:0;font-size:15px;line-height:1.4}
.cue .text div{overflow-wrap:anywhere}
.cue .pill{align-self:flex-start}
.editBox{border-top:1px solid var(--line);background:var(--panel);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.editBox>div{max-width:760px;margin:0 auto}
.editBox textarea{font:16px/1.5 inherit;font-family:inherit;width:100%;resize:none;color:var(--text);background:var(--window);border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px;height:4.6em}
.editBox textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.meter{display:flex;gap:8px;font-size:12px;color:var(--text3);margin:4px 2px 0;flex-wrap:wrap}
.meter .over{color:var(--bad);font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header><img src="icon-192.png" alt=""><h1>PODcut 리모컨</h1><button class="icon" id="add" hidden aria-label="새 프로젝트">+</button><button class="ghost" id="menu" hidden>설정</button></header>

  <section id="pairView" hidden>
    <div class="card pair">
      <h2 style="padding:0;font-size:17px;color:var(--text)">PC와 연결</h2>
      <p>PC의 PODcut에서 <b>공유 → 휴대폰 리모컨…</b>을 열고 QR코드를 찍거나, 8자리 코드를 넣으세요.</p>
      <input id="code" class="code" maxlength="9" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="XXXX XXXX" aria-label="연결 코드">
      <div class="actions"><button class="primary" id="pair">연결</button></div>
      <div class="error" id="pairError" role="alert"></div>
    </div>
    <p class="hint" id="iosHint" hidden>아이폰에서 알림을 받으려면 먼저 공유 버튼 → <b>홈 화면에 추가</b>를 누르고, 홈 화면 아이콘으로 연 뒤 연결하세요. 사파리와 홈 화면 앱은 연결이 따로입니다.</p>
  </section>

  <section id="mainView" hidden>
    <div class="status" id="pcLine"><span class="dot" id="pcDot"></span><span id="pcText">확인 중…</span><select id="pcPick" hidden aria-label="PC 고르기"></select></div>
    <div class="card" id="jobsCard" hidden><h2>진행 상황</h2><div id="jobs"></div></div>
    <div class="seg tabs" id="tabs" role="tablist">
      <button data-tab="mine" role="tab" aria-pressed="true">내 프로젝트<span class="n" id="mineCount"></span></button>
      <button data-tab="team" role="tab" aria-pressed="false">팀 프로젝트<span class="n" id="teamCount"></span></button>
    </div>
    <div class="card" style="margin-top:8px"><div id="projects"></div></div>
    <div class="card" id="pushCard" hidden>
      <div class="row"><div class="main"><div class="name">완료 알림</div><div class="sub" id="pushText">분석이 끝나면 이 휴대폰에 알려 줍니다.</div></div><button id="push">켜기</button></div>
    </div>
    <div class="error" id="mainError" role="alert"></div>
  </section>
</main>


<section id="cueView" hidden aria-label="대사 편집">
  <div class="cueHead"><button class="ghost" id="cueBack" aria-label="닫기">‹ 목록</button><div class="name" id="cueTitle"></div></div>
  <div class="cueTop">
    <div class="frame"><canvas id="cueFrame" width="960" height="540" aria-label="자막 미리보기"></canvas></div>
    <div class="cueNote" id="cueNote"></div>
  </div>
  <div class="cueList" id="cueList"></div>
  <div class="editBox" id="editBox" hidden>
    <div>
      <textarea id="cueText" rows="2" spellcheck="false" aria-label="자막 (줄바꿈은 Enter, 두 줄까지)"></textarea>
      <div class="meter" id="cueMeter"></div>
      <div class="actions" style="margin-top:8px"><button id="cueCancel">취소</button><button class="primary" id="cueSave">저장</button></div>
    </div>
  </div>
</section>

<div class="sheet" id="startSheet" role="dialog" aria-modal="true" aria-labelledby="startTitle">
  <div>
    <h3 id="startTitle">새 프로젝트</h3>
    <div class="sub" id="startPc"></div>
    <label>영상</label>
    <div class="pickList" id="files" role="radiogroup" aria-label="영상"></div>
    <label for="startName">프로젝트 이름</label>
    <input id="startName" maxlength="80">
    <label>정리 방식</label>
    <div class="seg" id="presets">
      <button data-preset="light" aria-pressed="false">가볍게</button>
      <button data-preset="recommended" aria-pressed="true">추천</button>
      <button data-preset="transcript" aria-pressed="false">대본만</button>
    </div>
    <div class="hint" id="presetHint"></div>
    <div class="actions"><button id="startCancel">취소</button><button class="primary" id="startGo">분석 시작</button></div>
    <div class="error" id="startError" role="alert"></div>
  </div>
</div>

<div class="sheet" id="menuSheet" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
  <div>
    <h3 id="menuTitle">설정</h3>
    <div class="sub" id="phoneName"></div>
    <div class="actions"><button id="menuClose">닫기</button><button id="unpair" style="color:var(--bad)">연결 해제</button></div>
  </div>
</div>

<script>
'use strict';
const API = 'https://ghgamrbcgbjtrixfkrmd.supabase.co';
const KEY = 'sb_publishable_9G-AYuAeSvl-KtyKrS7SQQ_bAHWJudC';  // public application key
const PRESETS = {light:'긴 무음만 줄입니다.', recommended:'PC에 저장된 정리 설정 그대로 분석합니다.', transcript:'아무것도 지우지 않고 받아쓰기만 합니다.'};
const $ = id => document.getElementById(id);
const store = {
  get(){ try { return localStorage.getItem('podcut-remote-token'); } catch { return null; } },
  set(v){ try { v ? localStorage.setItem('podcut-remote-token', v) : localStorage.removeItem('podcut-remote-token'); } catch {} },
  pc(v){ try { if (v === undefined) return localStorage.getItem('podcut-remote-pc'); localStorage.setItem('podcut-remote-pc', v); } catch { return null; } },
};
let token = store.get(), view = null, chosen = null, timer = null, busy = false;

const MESSAGES = {invalid_code:'코드가 맞지 않거나 만료됐습니다. PC에서 새 코드를 받으세요.', try_later:'잠시 뒤 다시 시도하세요.',
  too_many_commands:'이 PC에 기다리는 분석이 많습니다. 끝난 뒤 다시 시도하세요.', unknown_device:'PC를 찾지 못했습니다.', invalid_command:'요청이 올바르지 않습니다.'};
async function rpc(name, body){
  let r;
  try { r = await fetch(API + '/rest/v1/rpc/' + name, {method:'POST', headers:{apikey:KEY, 'Content-Type':'application/json'}, body:JSON.stringify(body), cache:'no-store'}); }
  catch { throw new Error('인터넷 연결을 확인하세요.'); }
  const text = await r.text();
  if (!r.ok) {
    let code = ''; try { code = JSON.parse(text).message || ''; } catch {}
    if (code === 'pairing_required') { forget(); throw new Error('연결이 끊겼습니다. PC에서 다시 연결하세요.'); }
    throw new Error(MESSAGES[code] || '서버 요청이 실패했습니다.');
  }
  return text ? JSON.parse(text) : null;
}
function forget(){ token = null; store.set(null); view = null; show(); }
const ago = (iso, now) => {
  const s = Math.max(0, (Date.parse(now || new Date().toISOString()) - Date.parse(iso)) / 1000);
  return s < 60 ? '방금' : s < 3600 ? Math.floor(s / 60) + '분 전' : s < 86400 ? Math.floor(s / 3600) + '시간 전' : Math.floor(s / 86400) + '일 전';
};
const size = n => n >= 1e9 ? (n / 1e9).toFixed(1) + ' GB' : Math.max(1, Math.round(n / 1e6)) + ' MB';
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); } for (const k of kids) if (k != null) e.append(k); return e; };
const bar = p => el('div', {class: 'bar' + (p == null || p < 0 ? ' wait' : '')}, el('i', p == null || p < 0 ? {} : {style: 'width:' + p + '%'}));

function show(){
  $('pairView').hidden = !!token; $('mainView').hidden = !token; $('menu').hidden = !token; $('add').hidden = !token;
  const ios = /iPhone|iPad/.test(navigator.userAgent) && !navigator.standalone;
  $('iosHint').hidden = !ios;
  if (!token) { clearTimeout(timer); return; }
  refresh();
}

async function pair(code){
  $('pairError').textContent = ''; $('pair').disabled = true;
  try {
    const ua = navigator.userAgent;
    const name = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android 휴대폰' : '휴대폰';
    const result = await rpc('ac_remote_claim', {code, phone_name:name});
    token = result.token; store.set(token); show();
  } catch (e) { $('pairError').textContent = e.message; }
  finally { $('pair').disabled = false; }
}

async function refresh(){
  clearTimeout(timer);
  if (!token) return;
  try { view = await rpc('ac_remote_view', {token}); $('mainError').textContent = ''; render(); if (cue) await cueRefresh(); }
  catch (e) { if (token) $('mainError').textContent = e.message; }
  if (token) timer = setTimeout(refresh, document.hidden ? 30000 : cue ? 2000 : 3000);
}

function render(){
  const devices = view.devices || [];
  const pick = $('pcPick'); pick.hidden = devices.length < 2;
  chosen = devices.find(d => d.id === (chosen && chosen.id)) || devices.find(d => d.id === store.pc()) || devices[0] || null;
  pick.replaceChildren(...devices.map(d => { const o = el('option', {value: d.id}, d.name); if (chosen && d.id === chosen.id) o.selected = true; return o; }));
  online = !!(chosen && (Date.parse(view.now) - Date.parse(chosen.seen_at)) < 90000);
  $('pcDot').className = 'dot' + (online ? ' on' : '');
  $('pcText').textContent = !chosen ? 'PC에서 PODcut을 켜고 로그인하면 여기에 나타납니다.' :
    chosen.name + (online ? ' · 켜져 있음' : ' · 꺼져 있음 (' + ago(chosen.seen_at, view.now) + ' 확인)');
  const state = (chosen && chosen.state) || {};

  const jobs = (view.commands || []).filter(c => chosen && c.device === chosen.id).slice(0, 8);
  $('jobsCard').hidden = !jobs.length;
  $('jobs').replaceChildren(...jobs.map(c => {
    const label = {queued:['기다리는 중', ''], running:['분석 중', 'run'], done:['완료', 'ok'], failed:['실패', 'bad'], cancelled:['취소됨', '']}[c.status];
    const main = el('div', {class: 'main'}, el('div', {class: 'name'}, c.args.name || '새 프로젝트'),
      el('div', {class: 'sub'}, c.message || (c.status === 'queued' ? (online ? 'PC가 곧 받습니다.' : 'PC가 켜지면 시작합니다.') : ago(c.updated_at, view.now))),
      c.status === 'running' ? bar(c.progress) : null);
    const row = el('div', {class: 'row'}, main, el('span', {class: 'pill ' + label[1]}, label[0]));
    if (c.status === 'queued') row.append(el('button', {class: 'ghost', onclick: () => cancel(c.id)}, '취소'));
    else if (c.status !== 'running') row.append(el('button', {class: 'x', 'aria-label': '목록에서 지우기', title: '지우기', onclick: () => dismiss(c.id)}, '×'));
    return row;
  }));

  files = state.files || [];
  $('add').disabled = !chosen;
  if ($('startSheet').classList.contains('open')) renderFiles();

  const projects = state.projects || [];
  const team = p => !!p.sharing;
  const counts = {mine: projects.filter(p => !team(p)).length, team: projects.filter(team).length};
  $('mineCount').textContent = counts.mine; $('teamCount').textContent = counts.team;
  for (const b of $('tabs').children) b.setAttribute('aria-pressed', b.dataset.tab === tab);
  const shown = projects.filter(p => team(p) === (tab === 'team'));
  $('projects').replaceChildren(...(shown.length ? shown.map(p => {
    const running = p.status === '분석 중' || p.status === '마무리 중';
    const editable = p.status === '분석 완료' || p.status === '편집 중';   // has subtitles to edit (remote_cues)
    return el('div', editable ? {class: 'row tap', role: 'button', tabindex: '0', 'aria-label': p.name + ' 대사 편집', onclick: () => openCues(p)} : {class: 'row'},
      el('div', {class: 'main'}, el('div', {class: 'name'}, p.name),
      el('div', {class: 'sub'}, [p.length, ago(p.updated, view.now)].filter(Boolean).join(' · ')),
      running ? bar(p.progress) : null),
      el('span', {class: 'pill' + (running ? ' run' : p.status === '분석 완료' ? ' ok' : '')}, p.status),
      editable ? el('span', {class: 'chev', 'aria-hidden': 'true'}, '›') : null);
  }) : [el('div', {class: 'empty'}, tab === 'team' ? '팀과 공유한 프로젝트가 없습니다.' : chosen ? '프로젝트가 없습니다. 오른쪽 위 +로 새 프로젝트를 만드세요.' : '—')]));

  const canPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  $('pushCard').hidden = !canPush;
  $('push').textContent = view.phone.push ? '끄기' : '켜기';
  $('pushText').textContent = view.phone.push ? '켜져 있습니다. 분석이 끝나면 알려 줍니다.' : '분석이 끝나면 이 휴대폰에 알려 줍니다.';
  $('phoneName').textContent = view.phone.name + ' · 이 휴대폰을 연결 해제하면 다시 연결할 때 PC의 새 코드가 필요합니다.';
}

let startFile = null, preset = 'recommended', files = [], online = false, tab = 'mine', named = false;
try { tab = localStorage.getItem('podcut-remote-tab') === 'team' ? 'team' : 'mine'; } catch {}
let filesKey = '';
function renderFiles(){
  if (startFile && !files.some(f => f.id === startFile.id)) startFile = null;
  $('startPc').textContent = chosen ? chosen.name + (online ? '' : ' · 꺼져 있음: PC가 켜지면 시작합니다') : '';
  $('startGo').disabled = !startFile || !chosen;
  // Rebuilt only when something changed: a refresh every 3 s must not swallow a tap.
  const key = JSON.stringify([files.map(f => [f.id, f.size, f.modified]), startFile && startFile.id, Math.floor(Date.parse(view.now) / 60000)]);
  if (key === filesKey) return;
  filesKey = key;
  $('files').replaceChildren(...(files.length ? files.map(f => {
    const row = el('div', {class: 'row', role: 'radio', tabindex: '0', 'aria-checked': String(!!startFile && startFile.id === f.id)},
      el('span', {class: 'check'}),
      el('div', {class: 'main'}, el('div', {class: 'name'}, f.name), el('div', {class: 'sub'}, f.folder + ' · ' + size(f.size) + ' · ' + ago(new Date(f.modified * 1000).toISOString(), view.now))));
    const pick = () => choose(f);
    row.addEventListener('click', pick); row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
    return row;
  }) : [el('div', {class: 'empty'}, '최근 2주 안에 생긴 새 녹화 파일이 없습니다. 예전 프로젝트의 녹화 파일이 있던 폴더를 봅니다.')]));
}
function choose(f){
  startFile = f;
  if (!named) $('startName').value = f.name.replace(/\.[^.]+$/, '').slice(0, 80);
  renderFiles();
}
function openStart(){
  if (!chosen) return;
  startFile = null; named = false; $('startName').value = ''; $('startError').textContent = '';
  setPreset('recommended'); filesKey = ''; renderFiles(); $('startSheet').classList.add('open');
}
function setPreset(p){ preset = p; for (const b of $('presets').children) b.setAttribute('aria-pressed', b.dataset.preset === p); $('presetHint').textContent = PRESETS[p]; }
async function start(){
  $('startGo').disabled = true; $('startError').textContent = '';
  try {
    await rpc('ac_remote_command', {token, device: chosen.id, kind: 'analyze_file', args: {file: startFile.id, name: $('startName').value.trim(), preset}});
    $('startSheet').classList.remove('open'); refresh();
  } catch (e) { $('startError').textContent = e.message; }
  finally { $('startGo').disabled = false; }
}
async function dismiss(id){ try { await rpc('ac_remote_dismiss', {token, command: id}); refresh(); } catch (e) { $('mainError').textContent = e.message; } }
async function cancel(id){ try { await rpc('ac_remote_cancel', {token, command: id}); refresh(); } catch (e) { $('mainError').textContent = e.message; } }

function base64url(text){ const s = atob(text.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((text.length + 3) % 4)); return Uint8Array.from(s, c => c.charCodeAt(0)); }
async function togglePush(){
  $('push').disabled = true; $('mainError').textContent = '';
  try {
    const reg = await navigator.serviceWorker.register('sw.js');
    if (view.phone.push) {
      const sub = await reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe();
      await rpc('ac_remote_subscribe', {token, subscription: null});
    } else {
      if (await Notification.requestPermission() !== 'granted') throw new Error('알림이 허용되지 않았습니다. 휴대폰 설정에서 알림을 허용하세요.');
      const r = await fetch(API + '/functions/v1/ac-remote-push', {headers: {apikey: KEY}});
      const {key} = await r.json();
      const sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: base64url(key)});
      await rpc('ac_remote_subscribe', {token, subscription: sub.toJSON()});
    }
    await refresh();
  } catch (e) { $('mainError').textContent = e.message || '알림을 켜지 못했습니다.'; }
  finally { $('push').disabled = false; }
}


// ── 대사 편집 (remote_cues.py on the PC): line breaks and misheard words ──
// The PC lays the project's subtitle cards out and puts them on the server; this
// page reads them, previews a card as the video shows it and sends one card's
// lines back at a time. The PC applies them while it does not have the project open.
let cue = null;   // {project, name, device, doc, stamp, asked, chosen, pending: {commandId: {card, lines}}, failed: {card: message}, note}
const clock = ms => { const s = Math.floor(ms / 1000); return s >= 3600 ? Math.floor(s / 3600) + ':' + String(Math.floor(s / 60) % 60).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0') : Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
async function openCues(p){
  if (!chosen) return;
  cue = {project: p.pid, name: p.name, device: chosen.id, doc: null, stamp: null, asked: null, chosen: null, pending: {}, failed: {}, note: ''};
  $('cueTitle').textContent = p.name; $('cueList').replaceChildren(); $('editBox').hidden = true; $('cueView').hidden = false;
  history.pushState({cue: true}, '');
  cueNote(online ? 'PC에서 자막을 불러오는 중…' : 'PC가 꺼져 있습니다. 마지막으로 받은 자막을 보여 줍니다.');
  await cueFetch();
  if (online) {
    try { cue.asked = await rpc('ac_remote_command', {token, device: cue.device, kind: 'open_cues', args: {project: cue.project}}); }
    catch (e) { cueNote(e.message, true); }
  }
  drawFrame();
}
function closeCues(){ cue = null; $('cueView').hidden = true; $('editBox').hidden = true; }
function cueNote(text, bad){ if (!cue) return; cue.note = text; $('cueNote').textContent = text; $('cueNote').className = 'cueNote' + (bad ? ' bad' : ''); }
async function cueFetch(){
  const c = cue; if (!c) return;
  const got = await rpc('ac_remote_document', {token, device: c.device, project: c.project, since: c.stamp});
  if (c !== cue || !got || !got.doc) return;
  c.doc = got.doc; c.stamp = got.updated_at;
  renderCues();
}
async function cueRefresh(){
  const c = cue; if (!c) return;
  const edits = (view.edits || []).filter(e => e.device === c.device && e.project === c.project);
  const asked = edits.find(e => e.id === c.asked);
  if (asked && asked.status === 'failed') { cueNote(asked.message || 'PC에서 자막을 불러오지 못했습니다.', true); c.asked = null; }
  else if (asked && asked.status === 'done') { c.asked = null; }
  let changed = false;
  for (const [id, item] of Object.entries(c.pending)) {
    const e = edits.find(x => x.id === id);
    if (!e || e.status === 'queued' || e.status === 'running') continue;
    delete c.pending[id]; changed = true;
    if (e.status === 'failed') { c.failed[item.card] = e.message || '고치지 못했습니다.'; cueNote('고치지 못했습니다: ' + c.failed[item.card], true); }
    else cueNote(e.message || '고쳤습니다.');
  }
  try { await cueFetch(); } catch (e) { cueNote(e.message, true); }
  if (changed) renderCues();
  if (!online && c.doc) cueNote('PC가 꺼져 있어 고칠 수 없습니다. PC에서 PODcut을 켜면 다시 고칠 수 있습니다.', true);
  else if (c.doc && c.note.startsWith('PC에서 자막을 불러오는')) cueNote((c.doc.shared ? '팀 프로젝트: 고칠 때마다 PC가 그 챕터를 잠깐 맡아 저장합니다. ' : '') + '자막을 눌러 고치세요. 줄바꿈은 Enter, 두 줄까지. PC에서 열려 있으면 그 화면에 바로 들어갑니다.');
}
function renderCues(){
  const c = cue; if (!c || !c.doc) return;
  const doc = c.doc, list = [], pendingCards = new Set(Object.values(c.pending).map(p => p.card));
  const chapters = (doc.chapters || []).slice().sort((a, b) => a.at - b.at);
  let next = 0;
  for (const card of doc.cards) {
    while (next < chapters.length && chapters[next].at <= card.at) { if (chapters.length > 1) list.push(el('div', {class: 'chapter'}, chapters[next].title)); next++; }
    const speaker = (doc.speakers || {})[card.row] || {};
    const waiting = pendingCards.has(card.id), failed = c.failed[card.id];
    const shown = waiting ? Object.values(c.pending).find(p => p.card === card.id).lines : card.lines;
    const item = el('div', {class: 'cue' + (c.chosen === card.id ? ' on' : ''), role: 'button', tabindex: '0', onclick: () => chooseCue(card.id)},
      el('div', {class: 'who'}, el('b', {}, speaker.name || ''), clock(card.at)),
      el('div', {class: 'text'}, ...shown.map(l => el('div', {}, l))),
      waiting ? el('span', {class: 'pill run'}, '저장 중') : failed ? el('span', {class: 'pill bad', title: failed}, '실패') : null);
    item.dataset.card = card.id;
    list.push(item);
  }
  if (!doc.cards.length) list.push(el('div', {class: 'empty'}, '자막이 없습니다. 익평삼 자막 카드가 있는 프로젝트에서 고칠 수 있습니다.'));
  $('cueList').replaceChildren(...list);
  if (c.chosen && !doc.cards.some(x => x.id === c.chosen)) { c.chosen = null; $('editBox').hidden = true; cueNote('PC에서 이 자막이 바뀌었습니다. 다시 골라 고치세요.', true); }
  else if (c.chosen && c.chosenLines && cueCard(c.chosen).lines.join('\n') !== c.chosenLines) {
    // Changed on the PC while this box was open: start from what it is now.
    c.chosenLines = cueCard(c.chosen).lines.join('\n'); $('cueText').value = c.chosenLines; cueInput();
    cueNote('PC에서 이 자막이 바뀌어 고칠 칸을 새로 채웠습니다.', true);
  }
  drawFrame();
}
function cueCard(id){ return cue && cue.doc ? cue.doc.cards.find(c => c.id === id) : null; }
function chooseCue(id){
  const c = cue, card = cueCard(id); if (!card) return;
  if (Object.values(c.pending).some(p => p.card === id)) { cueNote('이 자막을 저장하는 중입니다. 끝난 뒤 다시 고치세요.'); return; }
  c.chosen = id;
  for (const e of $('cueList').querySelectorAll('.cue')) e.classList.toggle('on', e.dataset.card === id);
  if (c.failed[id]) cueNote(c.failed[id], true);
  c.chosenLines = card.lines.join('\n'); $('cueText').value = c.chosenLines; $('editBox').hidden = false;
  cueInput();
}
const fontReady = (document.fonts && document.fonts.load) ? document.fonts.load('600 56px Pretendard', '가나다').catch(() => {}) : Promise.resolve();
const measure = document.createElement('canvas').getContext('2d');
function lineWidth(text, f){ measure.font = '600 ' + f.fontPx + 'px Pretendard, sans-serif'; let w = 0; for (const ch of text) w += measure.measureText(ch).width; return w + f.tracking * Math.max(0, [...text].length - 1); }
function typed(){ return $('cueText').value.split('\n').map(l => l.trim().replace(/\s+/g, ' ')).filter(Boolean); }
function cueInput(){
  const c = cue; if (!c || !c.doc) return;
  const f = c.doc.frame, lines = typed(), card = cueCard(c.chosen);
  const over = lines.map(l => lineWidth(l, f) > f.maxLine);
  const parts = lines.map((l, i) => el('span', {class: over[i] ? 'over' : ''}, (i + 1) + '줄 ' + Math.round(lineWidth(l, f) / f.maxLine * 100) + '%'));
  if (lines.length > f.maxLines) parts.push(el('span', {class: 'over'}, f.maxLines + '줄까지입니다'));
  if (over.some(Boolean)) parts.push(el('span', {class: 'over'}, '화면 폭을 넘습니다. 줄을 나누세요.'));
  $('cueMeter').replaceChildren(...parts);
  const same = card && lines.join('\n') === card.lines.join('\n');
  $('cueSave').disabled = !lines.length || lines.length > f.maxLines || over.some(Boolean) || same || !online;
  drawFrame(lines);
}
async function saveCue(){
  const c = cue, card = cueCard(c && c.chosen); if (!card) return;
  const lines = typed();
  $('cueSave').disabled = true;
  try {
    const id = await rpc('ac_remote_command', {token, device: c.device, kind: 'edit_cues', args: {project: c.project, card: card.id, before: card.lines, lines}});
    c.pending[id] = {card: card.id, lines}; delete c.failed[card.id];
    c.chosen = null; $('editBox').hidden = true; cueNote('PC로 보냈습니다. PC가 받아 저장하면 목록이 바뀝니다.');
    renderCues(); refresh();
  } catch (e) { cueNote(e.message, true); $('cueSave').disabled = false; }
}
const avatars = {};
function drawFrame(editing){
  const canvas = $('cueFrame'), ctx = canvas.getContext('2d'), c = cue;
  const ratio = Math.min(2, window.devicePixelRatio || 1), w = canvas.clientWidth || 360;
  if (canvas.width !== Math.round(w * ratio)) { canvas.width = Math.round(w * ratio); canvas.height = Math.round(w * ratio * 9 / 16); }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!c || !c.doc) return;
  const f = c.doc.frame, k = canvas.width / f.width, card = cueCard(c.chosen);
  for (const [row, speaker] of Object.entries(c.doc.speakers || {})) {
    if (!speaker.avatar) continue;
    let img = avatars[speaker.avatar];
    if (!img) { img = avatars[speaker.avatar] = new Image(); img.onload = () => drawFrame(editing); img.src = speaker.avatar; }
    if (img.complete && img.naturalWidth) {
      ctx.imageSmoothingEnabled = false;   // pixel-art avatars, as the editor's preview draws them
      ctx.drawImage(img, f.iconLeft * k, (f.rows[row] - f.iconHeight / 2) * k, f.iconWidth * k, f.iconHeight * k);
    }
  }
  const lines = editing || (card ? card.lines : null);
  if (!lines || !card) return;
  const centre = f.rows[card.row];
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'alphabetic';
  ctx.font = '600 ' + (f.fontPx * k) + 'px Pretendard, sans-serif';
  const m = ctx.measureText('가'), ascent = (m.fontBoundingBoxAscent || f.fontPx * k * 0.93);
  const top = centre - lines.length * f.pitch / 2;
  lines.slice(0, 3).forEach((line, i) => {
    let x = f.textLeft * k; const y = (top + i * f.pitch) * k + ascent;
    for (const ch of line) { ctx.fillText(ch, x, y); x += ctx.measureText(ch).width + f.tracking * k; }
  });
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.setLineDash([4, 4]);   // where a line must end: the middle of the frame
  ctx.beginPath(); ctx.moveTo((f.textLeft + f.maxLine) * k, 0); ctx.lineTo((f.textLeft + f.maxLine) * k, canvas.height); ctx.stroke(); ctx.setLineDash([]);
}
$('cueBack').onclick = () => { if (history.state && history.state.cue) history.back(); else closeCues(); };
window.addEventListener('popstate', () => { if (cue) closeCues(); });
$('cueText').oninput = cueInput;
$('cueCancel').onclick = () => { if (cue) cue.chosen = null; $('editBox').hidden = true; renderCues(); };
$('cueSave').onclick = saveCue;
window.addEventListener('resize', () => drawFrame());
fontReady.then(() => { if (cue) { drawFrame(); if (cue.chosen) cueInput(); } });

$('pair').onclick = () => pair($('code').value);
$('code').onkeydown = e => { if (e.key === 'Enter') pair($('code').value); };
$('pcPick').onchange = () => { store.pc($('pcPick').value); chosen = (view.devices || []).find(d => d.id === $('pcPick').value); render(); };
for (const b of $('presets').children) b.onclick = () => setPreset(b.dataset.preset);
$('add').onclick = openStart;
$('startName').oninput = () => { named = $('startName').value.trim() !== ''; };
for (const b of $('tabs').children) b.onclick = () => { tab = b.dataset.tab; try { localStorage.setItem('podcut-remote-tab', tab); } catch {} if (view) render(); };
$('startCancel').onclick = () => $('startSheet').classList.remove('open');
$('startGo').onclick = start;
$('push').onclick = togglePush;
$('menu').onclick = () => $('menuSheet').classList.add('open');
$('menuClose').onclick = () => $('menuSheet').classList.remove('open');
$('unpair').onclick = async () => { try { await rpc('ac_remote_unpair', {token}); } catch {} $('menuSheet').classList.remove('open'); forget(); };
for (const s of document.querySelectorAll('.sheet')) s.addEventListener('click', e => { if (e.target === s) s.classList.remove('open'); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && token) refresh(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// A QR code opens …/#pair=CODE: pair right away (the code is used once), then drop it from the address.
const fromLink = (location.hash.match(/pair=([A-Za-z0-9]{8})/) || [])[1];
if (fromLink) { history.replaceState(null, '', location.pathname); if (token) show(); else { $('code').value = fromLink; show(); pair(fromLink); } }
else show();
